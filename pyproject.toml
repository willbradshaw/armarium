[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "armarium"
version = "0.1.0"
description = "Create and validate Armarium Markdown vaults"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Bradshaw" }]
requires-python = ">=3.14"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema[format]>=4.23,<5",
  "markdown-it-py>=3,<4",
  "referencing>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/willbradshaw/armarium"
Repository = "https://github.com/willbradshaw/armarium"
Issues = "https://github.com/willbradshaw/armarium/issues"
Changelog = "https://github.com/willbradshaw/armarium/blob/main/CHANGELOG.md"

[project.scripts]
armarium = "armarium.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8",
  "ruff==0.16.8",
  "mypy",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.hatch.build]
artifacts = ["/vaults/starter/.scratch/.gitkeep", "/vaults/example/.scratch/.gitkeep"]
exclude = [
  "/vaults/*/.obsidian/workspace*.json",
  "/vaults/*/.env", "/vaults/*/.env.*", "/vaults/*/*.cookie",
  "/vaults/*/.scratch/**", "**/.DS_Store", "**/__pycache__/**",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/armarium", "vaults/starter", "extensions"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"vaults/starter" = "armarium/starter"
"extensions" = "armarium/extensions"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/extensions", "/vaults/starter", "/vaults/example", "/docs", "/README.md", "/pyproject.toml",
  "/ruff.toml", "/AGENTS.md", "/LICENSE", "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["package: builds distributions and installs a wheel in a fresh environment"]

[tool.mypy]
strict = true
