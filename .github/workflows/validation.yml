name: Validation
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python -m build
      - name: Validate every shipped vault
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from armarium.infrastructure import shipped_vaults
          for vault in shipped_vaults(Path.cwd()):
              subprocess.run(["armarium", "validate", str(vault), "--vault", str(vault)], check=True)
          PY
